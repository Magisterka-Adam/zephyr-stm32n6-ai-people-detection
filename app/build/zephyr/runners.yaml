# Available runners configured by board.cmake.
runners:
- stm32cubeprogrammer
- stlink_gdbserver

# Default flash runner if --runner is not given.
flash-runner: stm32cubeprogrammer

# Default debug runner if --runner is not given.
debug-runner: stlink_gdbserver

# Common runner configuration values.
config:
  board_dir: /home/a.paleczny/stm_workspace/zephyr/boards/st/stm32n6570_dk
  # Build outputs:
  elf_file: zephyr.elf
  hex_file: zephyr.hex
  bin_file: zephyr.signed.bin
  # Host tools:
  gdb: /home/a.paleczny/zephyr-sdk-0.17.4/arm-zephyr-eabi/bin/arm-zephyr-eabi-gdb-py
  openocd: /home/a.paleczny/zephyr-sdk-0.17.4/sysroots/x86_64-pokysdk-linux/usr/bin/openocd
  openocd_search:
    - /home/a.paleczny/zephyr-sdk-0.17.4/sysroots/x86_64-pokysdk-linux/usr/share/openocd/scripts

# Runner specific arguments
args:
  stm32cubeprogrammer:
    - --port=swd
    - --tool-opt= mode=HOTPLUG ap=1
    - --extload=MX66UW1G45G_STM32N6570-DK.stldr
    - --download-address=0x70000000
  stlink_gdbserver:
    - --apid=1
    - --extload=MX66UW1G45G_STM32N6570-DK.stldr

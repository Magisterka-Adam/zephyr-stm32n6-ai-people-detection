CONFIG_MY_APP=y
CONFIG_MAIN_STACK_SIZE=8192
# CONFIG_XIP is not set

CONFIG_USE_STM32_MW_ISP=y
CONFIG_DYNAMIC_INTERRUPTS=y
CONFIG_FLASH=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_LOG=y
# Temporary disable assertions due to https://github.com/zephyrproject-rtos/zephyr/issues/97904
CONFIG_ASSERT=n
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# -------------------------
# Display / Video
# -------------------------
CONFIG_DISPLAY=y
CONFIG_STM32_MEMMAP=y
CONFIG_VIDEO=y
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=4
CONFIG_VIDEO_STM32_DCMIPP_SENSOR_WIDTH=2592
CONFIG_VIDEO_STM32_DCMIPP_SENSOR_HEIGHT=1944
CONFIG_VIDEO_STM32_DCMIPP_SENSOR_PIXEL_FORMAT="pRAA"

# -------------------------
# LVGL
# -------------------------
CONFIG_LVGL=y

# Keep your minimal lv_conf if your project relies on it
# CONFIG_LV_CONF_MINIMAL=y
CONFIG_LV_USE_CANVAS=y
CONFIG_LV_USE_THEME_DEFAULT=y

# Font you use explicitly
CONFIG_LV_FONT_UNSCII_16=y

# LVGL memory pools (yours was far too small for canvas + widgets)
CONFIG_LV_Z_MEM_POOL_SIZE=131072

# Also ensure Zephyr heap exists for subsystems (FS, logging, etc.)
CONFIG_HEAP_MEM_POOL_SIZE=262144
CONFIG_MULTI_HEAP=y
CONFIG_MEM_ATTR_HEAP=y

# -------------------------
# Touch / Input (for button clicks)
# -------------------------
CONFIG_INPUT=y

# If your touch controller is on I2C (typical on DK boards)
CONFIG_I2C=y

# -------------------------
# CPU / MPU / misc
# -------------------------
CONFIG_ARM_MPU=y
CONFIG_CPU_LOAD=y

# To be sure LOGGER can still output message move this one priority level above main thread
CONFIG_LOG_PROCESS_THREAD_CUSTOM_PRIORITY=y
CONFIG_LOG_PROCESS_THREAD_PRIORITY=13

# -------------------------
# Disk + filesystem
# -------------------------
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y

CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y

CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_MAX_LFN=255
